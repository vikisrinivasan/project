{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>VoxGauge Upload</title>
</head>
<body>
    <img src="{% static 'voxgauge_logo.svg' %}" alt="VoxGauge logo" />
    {% if success %}<p>Upload successful.</p>{% endif %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="file" name="file" accept="audio/*,application/octet-stream,video/*,image/*,*/*">
        <button type="submit">Upload</button>
    </form>
</body>
</html>
